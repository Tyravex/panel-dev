version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tyravex-postgres
    restart: always
    environment:
      POSTGRES_USER: tyravex
      POSTGRES_PASSWORD: tyravexpass
      POSTGRES_DB: tyravex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyravex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: